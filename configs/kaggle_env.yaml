# p24_env: anh hong vi MOI TRUONG CHUP KEM -- thieu sang, anh sang khong deu (vung sang/toi bat on, vet nhoe
# toi), loe sang -- moi yeu to ngau nhien; model phai lam dep va net lai. Kien truc giu nguyen p22/p23 (nhanh H).
#
# Nguoi dung (06/10/2026): anh hong do moi truong chup kem, cac yeu to ngau nhien; sau do: "xoa suong mu di,
# toi chi can anh co cac vung sang toi, bat on". Suong mu (fog_*, qjepa/corruptions/light.py) da viet va test
# nhung TAT o day (khong co khoa fog_* nao). Thay doi so voi p23_illum:
#  - env_clear_probability 0,2: 20% frame "moi truong trong" (khong loe, khong anh sang khong deu, khong thieu
#    sang) -- chi mo camera va hat. p22 tren anh chi mo: 28,00 -> 23,66 dB (lam sang ca anh von du sang),
#    vi ~88% anh train bi lam toi va gan nhu anh nao cung co anh sang can sua.
#  - Mo chuyen dong ngau nhien giam (55% -> 20%, 2-6 -> 2-4 px): khong phai do moi truong, va khong go duoc khi
#    khong biet vet cua tung anh (oracle Wiener: mot kernel co dinh cho moi anh 31,3 -> 23,6 dB).
# Doi corruption -> train lai ca hai phase.
extends: kaggle_illum.yaml

runtime:
  output_dir: /kaggle/working/qwt_jepa_version3/outputs/p24_env

corruption:
  image:
    motion_probability: 0.2             # p23: 0.55
    motion_length_px: [2, 4]            # p23: [2, 6]
    env_clear_probability: 0.2
