# p23_illum: p22_light + ANH SANG KHONG DEU + loe sang muc vua. Nhanh anh sang (H) giu nguyen.
#
# Log Kaggle cua p22 (Cell 14c, 05/10/2026): anh hu hai chi la anh mo + MOT LOP TOI DEU KHAP khung --
# buoc thieu sang cua repo nhan mot he so phoi sang, gamma, can bang trang CHUNG cho ca anh (vignette chi
# theo khoang cach toi tam), con loe nhe cua p22 chi co khi khung co den nen hau nhu khong thay. Nguoi
# dung can: do sang thay doi ngau nhien theo vung, loe sang, nhoe toi -- de model hoc can bang anh sang.
#
#  - illum_* (qjepa/corruptions/light.py: illumination_field), tren anh sang tuyen tinh truoc buoc mo,
#    tren 80% frame: 2-5 vung sang/toi Gauss (moi vung +-1-3 stop, sigma 10-35% khung), dai sang dan
#    0-2,5 stop qua khung (do sang trung binh theo stop giu nguyen, chi phan bo doi), va voi xac suat 0,7
#    1-3 vet nhoe toi (mep mem, keo dai toi 4 lan, lam toi 50-95% o tam).
#    Gamma cua buoc thieu sang nen chenh lech: do tren 60 frame, chenh sang/toi giua cac khoi 32x32 cua anh
#    CUOI (p95/p5) la x2,2 trung vi, x3,4 o p90 (muc 0,5-2 stop chi x1,7: kho thay). Sau do loe sang tinh tren canh
#    da chieu khong deu, roi chuoi cu (mo, thieu sang, hat, JPEG).
#  - Loe sang muc "vua": nguong 1,5-3 (troi rat sang van loe nhe), den x5-30, quang 0,08-0,8.
#    Do tren 190 frame: suong vung toi p90 0,124 (p21 0,236, p22 0,032).
#  - Nhanh anh sang (H) co ban do he so sang g thay doi theo vi tri: dung loai nhieu nay de go.
#
# Doi corruption -> doi hash ca hai phase: train lai phase 1. Phase 2: 4000 update.
extends: kaggle_light.yaml

runtime:
  output_dir: /kaggle/working/qwt_jepa_version3/outputs/p23_illum

corruption:
  image:
    light_knee: [1.5, 3.0]              # p22: [2.0, 4.0]; p21: [1.0, 2.5]
    light_wide_gain: [0.0, 0.8]         # p22: [0.0, 0.5]
    light_gain: [5.0, 30.0]             # p22: [4.0, 20.0]
    light_bloom_strength: [0.08, 0.8]   # p22: [0.05, 0.5]
    light_ghost_strength: [0.005, 0.04] # p22: [0.005, 0.03]
    illum_probability: 0.8
    illum_strength: [1.0, 3.0]          # stop moi vung, sang hoac toi
    illum_blobs: [2, 5]
    illum_blob_size: [0.1, 0.35]        # sigma, phan cua khung
    illum_gradient: [0.0, 2.5]          # stop qua ca khung
    illum_smudge_probability: 0.7
    illum_smudge_count: [1, 3]
    illum_smudge_size: [0.05, 0.2]
    illum_smudge_elongation: [1.0, 4.0]
    illum_smudge_depth: [0.5, 0.95]     # lam toi o tam vet
